name: Contract validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
  postgres-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cleanroom
          POSTGRES_PASSWORD: cleanroom
          POSTGRES_DB: cleanroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanroom -d cleanroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEANROOM_TEST_DATABASE_URL: postgresql+psycopg://cleanroom:cleanroom@localhost:5432/cleanroom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -p test_action_runtime.py -v
