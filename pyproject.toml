[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroom-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
]
description = "Typed contracts and persistent runtime for CleanRoomOS"

[project.scripts]
cleanroom-server = "cleanroom_os.server:main"

[tool.setuptools.packages.find]
include = ["cleanroom_os*"]
