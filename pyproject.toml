[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroom-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3"]
description = "Local cleanroom sampling workflows, validation, and human QA evidence for CleanRoomOS"

[project.urls]
Repository = "https://github.com/Mapped-Assembly/CleanRoomOS"
Issues = "https://github.com/Mapped-Assembly/CleanRoomOS/issues"

[tool.setuptools.packages.find]
include = ["cleanroom_os*"]
